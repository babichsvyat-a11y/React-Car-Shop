services:
  catalog_db:
    image: postgres:16-alpine
    container_name: catalog_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${CATALOG_DB_NAME}
    ports:
      - ${CATALOG_DB_PORT}:5432
    volumes:
      - catalog_postgres_data:/var/lib/postgresql/data

  user_db:
    image: postgres:16-alpine
    container_name: user_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    ports:
      - ${USER_DB_PORT}:5432
    volumes:
      - users_postgres_data:/var/lib/postgresql/data

  payment_db:
    image: postgres:16-alpine
    container_name: payment_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${PAYMENT_DB_NAME}
    ports:
      - ${PAYMENT_DB_PORT}:5432
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data

  feedback_db:
    image: postgres:16-alpine
    container_name: feedback_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${FEEDBACK_DB_NAME}
    ports:
      - ${FEEDBACK_DB_PORT}:5432
    volumes:
      - feedback_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: react_car_redis
    restart: always
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - redis_data:/data

  feedback_redis:
    image: redis:7-alpine
    container_name: feedback_redis
    restart: always
    command: redis-server --save 60 1 --loglevel notice --port 6380
    ports:
      - ${FEEDBACK_REDIS_PORT}:6380
    volumes:
      - feedback_redis_data:/data

  catalog_service:
    build:
      context: ./backend/services/catalogService
      dockerfile: Dockerfile.dev
    container_name: catalog_service
    ports:
      - ${CATALOG_SERVICE_PORT}:${CATALOG_SERVICE_PORT}
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@catalog_db:5432/${CATALOG_DB_NAME}?schema=public"
      REDIS_URL: "redis://${REDIS_HOST}:${REDIS_PORT}"
      PORT: ${CATALOG_SERVICE_PORT}
    depends_on:
      - catalog_db
      - redis

  auth_service:
    build:
      context: ./backend/services/authService
      dockerfile: Dockerfile.dev
    container_name: auth_service
    ports:
      - ${USER_SERVICE_PORT}:${USER_SERVICE_PORT}
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@user_db:5432/${USER_DB_NAME}?schema=public"
      PORT: ${USER_SERVICE_PORT}
    depends_on:
      - user_db

  payment_service:
    build:
      context: ./backend/services/paymentService
      dockerfile: Dockerfile.dev
    container_name: payment_service
    ports:
      - ${PAYMENT_SERVICE_PORT}:${PAYMENT_SERVICE_PORT}
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@payment_db:5432/${PAYMENT_DB_NAME}?schema=public"
      PORT: ${PAYMENT_SERVICE_PORT}
    depends_on:
      - payment_db

  feedback_service:
    build:
      context: ./backend/services/feedbackService
      dockerfile: Dockerfile.dev
    container_name: feedback_service
    ports:
      - ${FEEDBACK_SERVICE_PORT}:${FEEDBACK_SERVICE_PORT}
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@feedback_db:5432/${FEEDBACK_DB_NAME}?schema=public"
      REDIS_URL: "redis://${FEEDBACK_REDIS_HOST}:${FEEDBACK_REDIS_PORT}"
      PORT: ${FEEDBACK_SERVICE_PORT}
      TURBOSMS_TOKEN: ${TURBOSMS_TOKEN}
    depends_on:
      - feedback_db
      - feedback_redis

  api_gateway:
    image: nginx:alpine
    container_name: api_gateway
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - catalog_service
      - auth_service
      - payment_service
      - feedback_service

volumes:
  catalog_postgres_data:
  users_postgres_data:
  payment_postgres_data:
  feedback_postgres_data:
  redis_data:
  feedback_redis_data:
