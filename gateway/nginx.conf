worker_processes 1;

events {
  worker_connections 1024;
}

http { 
  include mime.types;
  default_type application/octet-stream;

  sendfile on;

  underscores_in_headers on;

  keepalive_timeout 65;

  upstream catalog_cluster{
    server  catalog_service:5080;
    # server  catalog_service_1:5080;
    # server  catalog_service_2:5084;
    # server  catalog_service_3:5085;
  }

  upstream auth_cluster{
    server auth_service:5081;
    # server auth_service_1:5081;
    # server auth_service_2:5086;
    # server auth_service_3:5087;
  }

  upstream payment_cluster{
    server payment_service:5082;
    # server payment_service_1:5082;
    # server payment_service_2:5088;
    # server payment_service_3:5089;
  }

  upstream feedback_cluster{
    server feedback_service:5083;
    # server feedback_service_1:5083;
    # server feedback_service_2:5090;
    # server feedback_service_3:5091;
  }

  server {
    listen 8000;
    server_name localhost;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Idempotency-Key' always;

    if ($request_method = 'OPTIONS') {
      return 204;
    }

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location /api/v1/catalog {
      proxy_pass http://catalog_cluster;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Internal-Service "";
    }

    location /graphql {
      proxy_pass http://auth_cluster/graphql;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host $host;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
      proxy_set_header X-Internal-Service "";
    }

    location /api/v1/payment {
      proxy_pass http://payment_cluster;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_pass_header Idempotency-Key;
      proxy_set_header X-Internal-Service "";

    }

    location /api/v1/feedback {
      proxy_pass http://feedback_cluster;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Internal-Service "";
    }
  }
 }