scalar DateTime

enum Role {
  USER
  ADMIN
}

type User {
  id: ID!
  email: String!
  first_name: String
  last_name: String!
  role: Role!
  created_at: DateTime!
  updated_at: DateTime!
}

type AuthPayLoad {
  access_token: String!
  user: User!
}

input RegisterInput {
  email: String!
  password: String!
  first_name: String
  last_name: String!
}

input LoginInput {
  email: String!
  password: String!
}

type Query {
  me: User
}

type Mutation {
  register(input: RegisterInput!): AuthPayLoad!
  login(input: LoginInput!): AuthPayLoad!
  refreshToken: AuthPayLoad!
  logout: Boolean!
}
